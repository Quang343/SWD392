<div class="bg-brand-gradient min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-md">

    <!-- Logo -->
    <div class="flex items-center gap-3 mb-8 justify-center">
      <div class="w-10 h-10 bg-[#4F46E5] rounded-lg flex items-center justify-center shadow-lg shadow-[#4F46E5]/20">
        <span class="material-symbols-outlined text-white text-2xl">schedule</span>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-gray-900">Chronometer</h1>
    </div>

    <!-- Main Card -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-xl shadow-gray-200/50 p-8 sm:p-10">
      <header class="mb-10 text-center">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-3">Create an Account</h2>
        <p class="text-gray-500 text-lg">Join the Chronometer productivity platform</p>
      </header>

      <form (submit)="onRegister()" #regForm="ngForm" class="space-y-5">

        <!-- Error Message -->
        <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 text-sm p-3 rounded-xl text-center">
          {{ errorMessage }}
        </div>

        <!-- Success Message -->
        <div *ngIf="successMessage" class="bg-green-50 border border-green-200 text-green-700 text-sm p-3 rounded-xl text-center">
          {{ successMessage }}
        </div>

        <!-- Username -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-900">Username (Tên tài khoản)</label>
          <input name="username" [(ngModel)]="model.username" required minlength="3"
                 class="input-field input-shadow"
                 placeholder="Nhập tên tài khoản" type="text"/>
        </div>

        <!-- Full Name -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-900">Full Name (Họ và tên)</label>
          <input name="fullName" [(ngModel)]="model.fullName" required minlength="2"
                 class="input-field input-shadow"
                 placeholder="Nhập họ và tên của bạn" type="text"/>
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-900">Email</label>
          <input name="email" [(ngModel)]="model.email" required email
                 class="input-field input-shadow"
                 placeholder="name@company.com" type="email"/>
        </div>

        <!-- Department & Position -->
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-gray-900">Department (Phòng ban)</label>
            <div class="relative">
              <select name="department" [(ngModel)]="model.department" required
                      class="input-field input-shadow appearance-none cursor-pointer pr-8">
                <option value="" disabled selected>Chọn phòng ban</option>
                <option value="IT">Công nghệ thông tin</option>
                <option value="HR">Nhân sự</option>
                <option value="Marketing">Marketing</option>
                <option value="Finance">Tài chính</option>
                <option value="Sales">Kinh doanh</option>
              </select>
              <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xl">expand_more</span>
            </div>
          </div>
          <div class="space-y-1.5">
            <label class="text-sm font-semibold text-gray-900">Position (Vị trí)</label>
            <div class="relative">
              <select name="position" [(ngModel)]="model.position" required
                      class="input-field input-shadow appearance-none cursor-pointer pr-8">
                <option value="" disabled selected>Chọn vị trí</option>
                <option value="Intern">Intern</option>
                <option value="Junior">Junior</option>
                <option value="Senior">Senior</option>
                <option value="Lead">Lead</option>
                <option value="Manager">Manager</option>
              </select>
              <span class="material-symbols-outlined absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xl">expand_more</span>
            </div>
          </div>
        </div>

        <!-- Password -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-900">Password (Mật khẩu)</label>
          <input name="password" [(ngModel)]="model.password" required minlength="6"
                 class="input-field input-shadow"
                 placeholder="Tạo mật khẩu mạnh (ít nhất 6 ký tự)" type="password"/>
        </div>

        <!-- Confirm Password -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-900">Confirm Password (Nhập lại mật khẩu)</label>
          <input name="confirmPassword" [(ngModel)]="confirmPassword" required minlength="6"
                 class="input-field input-shadow"
                 placeholder="Nhập lại mật khẩu" type="password"/>
        </div>

        <!-- Terms -->
        <div class="flex items-center gap-3">
          <input type="checkbox" id="terms" [(ngModel)]="agreedTerms" name="agreedTerms"
                 class="h-4 w-4 rounded border-gray-300 text-[#4F46E5] focus:ring-[#4F46E5]/30 cursor-pointer">
          <label for="terms" class="text-sm text-gray-500">
            I agree to the <a class="text-[#4F46E5] font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-[#4F46E5] font-semibold hover:underline" href="#">Privacy Policy</a>
          </label>
        </div>

        <!-- Submit -->
        <button [disabled]="!isFormComplete || isLoading"
                class="w-full bg-[#4F46E5] hover:bg-[#4338ca] text-white py-3.5 rounded-xl font-bold text-base shadow-lg shadow-[#4F46E5]/20 active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed mt-2"
                type="submit">
          <span *ngIf="!isLoading">Register Now</span>
          <span *ngIf="isLoading">Đang xử lý...</span>
          <span *ngIf="!isLoading" class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-white px-4 text-gray-400 font-bold tracking-widest">OR</span>
        </div>
      </div>

      <!-- Login Link -->
      <p class="text-center text-gray-500 font-medium">
        Already have an account?
        <a class="text-[#4F46E5] font-bold hover:underline decoration-2 underline-offset-4 ml-1" routerLink="/login">Login</a>
      </p>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center">
      <div class="flex justify-center gap-6">
        <a class="text-xs font-semibold text-gray-400 hover:text-[#4F46E5] transition-colors" href="#">Support</a>
        <a class="text-xs font-semibold text-gray-400 hover:text-[#4F46E5] transition-colors" href="#">Privacy Policy</a>
        <a class="text-xs font-semibold text-gray-400 hover:text-[#4F46E5] transition-colors" href="#">English</a>
      </div>
    </footer>

  </main>
</div>
