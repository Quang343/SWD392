<div class="bg-brand-gradient min-h-screen flex items-center justify-center p-6">
  <main class="w-full max-w-md">

    <!-- Logo -->
    <div class="flex items-center gap-3 mb-8 justify-center">
      <div class="w-10 h-10 bg-[#4F46E5] rounded-lg flex items-center justify-center shadow-lg shadow-[#4F46E5]/20">
        <span class="material-symbols-outlined text-white text-2xl">schedule</span>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-gray-900">Chronometer</h1>
    </div>

    <!-- Main Card -->
    <div class="bg-white border border-gray-200 rounded-2xl shadow-xl shadow-gray-200/50 p-8 sm:p-10">
      <header class="mb-10 text-center">
        <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-3">Welcome back</h2>
        <p class="text-gray-500 text-lg">Please enter your details to sign in.</p>
      </header>

      <form (submit)="onLogin()" #loginForm="ngForm" class="space-y-6">

        <!-- Error Message -->
        <div *ngIf="message" class="bg-red-50 border border-red-200 text-red-700 text-sm p-3 rounded-xl text-center">
          {{ message }}
        </div>

        <!-- Email / Username -->
        <div class="space-y-1.5">
          <label class="text-sm font-semibold text-gray-900" for="login_username">Email address</label>
          <input name="username" [(ngModel)]="username" required minlength="3"
            class="input-field input-shadow" id="login_username"
            placeholder="name@company.com" type="text" />
        </div>

        <!-- Password -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-center">
            <label class="text-sm font-semibold text-gray-900" for="login_password">Password</label>
          </div>
          <input name="password" [(ngModel)]="password" required minlength="3"
            class="input-field input-shadow" id="login_password"
            placeholder="••••••••" type="password" />
        </div>

        <!-- Remember me & Forgot -->
        <div class="flex items-center justify-between">
          <label class="flex items-center space-x-2 cursor-pointer group">
            <input class="h-4 w-4 rounded border-gray-300 text-[#4F46E5] focus:ring-[#4F46E5]/30 cursor-pointer"
              type="checkbox" />
            <span class="text-sm font-medium text-gray-500 group-hover:text-gray-900 transition-colors">Remember
              me</span>
          </label>
          <a class="text-sm font-semibold text-[#4F46E5] hover:text-[#4338ca] transition-colors" href="#">Forgot
            password?</a>
        </div>

        <!-- Submit -->
        <button [disabled]="loginForm.invalid || isLoading"
          class="w-full bg-[#4F46E5] hover:bg-[#4338ca] text-white py-3.5 rounded-xl font-bold text-base shadow-lg shadow-[#4F46E5]/20 active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 group disabled:opacity-50 disabled:cursor-not-allowed"
          type="submit">
          <span *ngIf="!isLoading">Sign in</span>
          <span *ngIf="isLoading">Đang xử lý...</span>
          <span *ngIf="!isLoading"
            class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-gray-200"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-white px-4 text-gray-400 font-bold tracking-widest">OR</span>
        </div>
      </div>

      <!-- Social Login -->
      <div class="space-y-4">
        <button
          class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl hover:bg-gray-50 transition-all font-medium text-gray-900 shadow-sm">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              fill="#FBBC05"></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="#EA4335"></path>
          </svg>
          <span>Sign in with Google</span>
        </button>
        <button
          class="w-full flex items-center justify-center gap-3 px-4 py-3 border border-gray-200 rounded-xl hover:bg-gray-50 transition-all font-medium text-gray-900 shadow-sm">
          <span class="material-symbols-outlined text-gray-500 text-[20px]">vpn_key</span>
          <span>Sign in with SSO</span>
        </button>

      </div>
      <p class="text-center text-gray-500 font-medium mt-8">
        Don't have an account?
        <a class="text-[#4F46E5] font-bold hover:underline decoration-2 underline-offset-4 ml-1"
          routerLink="/register">Request Access</a>
      </p>
    </div>

    <!-- Footer -->
    <footer class="mt-6 text-center">
      <div class="flex justify-center gap-6">
        <a class="text-xs font-semibold text-gray-400 hover:text-[#4F46E5] transition-colors" href="#">Support</a>
        <a class="text-xs font-semibold text-gray-400 hover:text-[#4F46E5] transition-colors" href="#">Privacy
          Policy</a>
        <a class="text-xs font-semibold text-gray-400 hover:text-[#4F46E5] transition-colors" href="#">English</a>
      </div>
    </footer>

  </main>
</div>
